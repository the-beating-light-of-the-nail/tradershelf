# Trader Shelf · 收盘归档管线
# 每交易日 16:10（北京）自动：抓收盘数据 → 生成静态站 → 部署 → IndexNow 推送 → 回写归档 JSON 到仓库
# 需要仓库 Secrets：CLOUDFLARE_API_TOKEN（含 Workers Scripts:Edit + 该 zone 的部署权限）、CLOUDFLARE_ACCOUNT_ID
name: daily-archive

on:
  schedule:
    # UTC 08:10 = 北京 16:10，周一到周五；法定假日靠「无新归档」自动跳过
    - cron: '10 8 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: '强制构建部署（即使当天没有新归档）'
        type: boolean
        default: false

concurrency:
  group: daily-archive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 记录抓取前的归档数
        id: before
        run: echo "count=$(ls data/archive/*.json 2>/dev/null | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: 抓取收盘数据
        run: node scripts/fetch-data.mjs

      - name: 判断是否产生新归档
        id: diff
        run: |
          count=$(ls data/archive/*.json 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt "${{ steps.before.outputs.count }}" ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "当天无新归档（休市或数据源未更新），跳过构建与部署"
          fi

      - name: 构建静态站
        if: steps.diff.outputs.new == 'true' || inputs.force
        run: npx nuxt generate

      - name: 部署到 Cloudflare
        if: steps.diff.outputs.new == 'true' || inputs.force
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: IndexNow 推送新增 URL
        if: steps.diff.outputs.new == 'true' || inputs.force
        run: node scripts/indexnow.mjs

      - name: 回写归档数据到仓库
        # 归档 JSON 是「永不重建的累积资产」，必须进仓库，否则下次 CI 的新克隆会丢掉历史
        if: steps.diff.outputs.new == 'true'
        run: |
          git config user.name "tradershelf-bot"
          git config user.email "bot@tradershelf.com"
          git add data/
          if git diff --staged --quiet; then
            echo "数据无变化，无需提交"
          else
            git commit -m "chore(data): 收盘归档 $(date -u +%F)"
            git push
          fi
