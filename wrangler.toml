# Trader Shelf · 生产站（Nuxt SSG 产物 + Crypto Worker 代理）
# 部署：npm run deploy（= 抓数据 → generate → wrangler deploy → IndexNow 推送）
# 注意：routes/main 必须放在 [assets] 段之前，否则被 TOML 归进 assets 表、自定义域静默不生效
name = "tradershelf"
main = "worker/index.js"
compatibility_date = "2026-10-01"

routes = [
  { pattern = "tradershelf.com", custom_domain = true },
  { pattern = "www.tradershelf.com", custom_domain = true }
]

[assets]
directory = "./.output/public"
# 显式绑定：worker 里 env.ASSETS 才能兜住未命中路径，回落到自定义 404 页（否则只有纯文本 404）
binding = "ASSETS"
# 未命中资产的请求交给 worker 兜（worker 内回 404.html 内容 + 404 状态码）；
# 若设成 "404-page"，Cloudflare 会 307 到 /404 且返回 200（软 404），对 SEO 不利
not_found_handling = "none"
# 目录式路由（/crypto、/xingtu）默认会 307 到带斜杠版本，白丢一跳；
# 与 canonical / sitemap 的无斜杠形式对齐，统一去掉尾部斜杠
html_handling = "drop-trailing-slash"
# /api/* 等非资产路径落到 worker；静态路径优先直出资产
